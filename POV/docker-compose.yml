# ============================================================================
# StayIn Local Side — POV deployment bundle
# Runs Postgres, the Go edge server, the Next.js CMS and an nginx front door.
# Use docker-compose.build.yml on a development machine to build from source.
# ============================================================================
name: stayin-local

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stayin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stayin}
      POSTGRES_DB: ${POSTGRES_MAIN_DB:-stayin_main}
      TZ: ${TZ:-Asia/Jakarta}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates stayin_local on first boot. stayin_main comes from POSTGRES_DB.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ${POSTGRES_MAIN_DB:-stayin_main}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    image: stayin/backend:${STAYIN_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_MODE: combined
      HTTP_ADDR: :8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Asia/Jakarta}
      MAIN_DATABASE_URL: postgres://${POSTGRES_USER:-stayin}:${POSTGRES_PASSWORD:-stayin}@postgres:5432/${POSTGRES_MAIN_DB:-stayin_main}?sslmode=disable
      LOCAL_DATABASE_URL: postgres://${POSTGRES_USER:-stayin}:${POSTGRES_PASSWORD:-stayin}@postgres:5432/${POSTGRES_LOCAL_DB:-stayin_local}?sslmode=disable
      NODE_API_KEY: ${NODE_API_KEY:-}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-2}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-32-byte-random-string-please}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-8h}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-168h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://192.168.1.10}
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ${BOOTSTRAP_SUPER_ADMIN_EMAIL:-owner@stayin.local}
      BOOTSTRAP_SUPER_ADMIN_PASSWORD: ${BOOTSTRAP_SUPER_ADMIN_PASSWORD:-Owner#2026}
      BOOTSTRAP_SUPER_ADMIN_NAME: ${BOOTSTRAP_SUPER_ADMIN_NAME:-StayIn Owner}
      BOOTSTRAP_TENANT_ADMIN_EMAIL: ${BOOTSTRAP_TENANT_ADMIN_EMAIL:-admin@dlu-alfateve.local}
      BOOTSTRAP_TENANT_ADMIN_PASSWORD: ${BOOTSTRAP_TENANT_ADMIN_PASSWORD:-Mitra#2026}
      BOOTSTRAP_TENANT_ADMIN_NAME: ${BOOTSTRAP_TENANT_ADMIN_NAME:-DLU Alfateve Admin}
      TENANT_SLUG: ${TENANT_SLUG:-dlu-alfateve}
      TENANT_NAME: ${TENANT_NAME:-DLU X ALFATEVE}
      NODE_CODE: ${NODE_CODE:-DLU-NODE-01}
      MEDIA_ROOT: /DATA/Media
      MEDIA_MOVIES_DIR: Movies
      MEDIA_BANNERS_DIR: Banners
      MEDIA_POSTERS_DIR: Posters
      MEDIA_APK_DIR: Apk
      SCAN_ON_START: ${SCAN_ON_START:-true}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-300}
      SCAN_COMPUTE_HASH: ${SCAN_COMPUTE_HASH:-true}
      SCAN_HASH_WORKERS: ${SCAN_HASH_WORKERS:-2}
      SCAN_MAX_DEPTH: ${SCAN_MAX_DEPTH:-6}
      STREAM_BUFFER_BYTES: ${STREAM_BUFFER_BYTES:-65536}
      STREAM_MAX_OPEN_FILES: ${STREAM_MAX_OPEN_FILES:-256}
      STREAM_CACHE_SECONDS: ${STREAM_CACHE_SECONDS:-86400}
      WS_PING_INTERVAL_SECONDS: ${WS_PING_INTERVAL_SECONDS:-25}
      WS_WRITE_TIMEOUT_SECONDS: ${WS_WRITE_TIMEOUT_SECONDS:-10}
      HEARTBEAT_TIMEOUT_SECONDS: ${HEARTBEAT_TIMEOUT_SECONDS:-120}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      PAIRING_TTL_MINUTES: ${PAIRING_TTL_MINUTES:-30}
      SYNC_INTERVAL_SECONDS: ${SYNC_INTERVAL_SECONDS:-15}
      CLOUD_BASE_URL: ${CLOUD_BASE_URL:-}
      CLOUD_API_KEY: ${CLOUD_API_KEY:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ${MEDIA_HOST_DIR:-./storage}:/DATA/Media
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    image: stayin/web:${STAYIN_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Asia/Jakarta}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8080/api/v1}
      NEXT_PUBLIC_DEFAULT_TENANT: ${TENANT_SLUG:-dlu-alfateve}
    ports:
      - "${WEB_PORT:-3000}:3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - web
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
    name: stayin-pgdata
